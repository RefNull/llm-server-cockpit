# Template host profile. This file IS tracked by git — it must never contain real
# machine-specific facts. Copy it to hosts/<your-hostname>.yaml (gitignored by default,
# see .gitignore) and fill in your own values there.

hostname: example-host

network:
  vpn:
    provider: "TODO"     # e.g. tailscale, wireguard — the overlay this host is reachable through
    interface: "TODO"    # e.g. tailscale0, wg0 — gateway binds ONLY to this interface's address
  wol:
    interface: "TODO"    # NIC that receives the magic packet, e.g. enp5s0
    mac: "00:00:00:00:00:00"
  gateway:
    port: 8090
    health_check_timeout: 120

gpus:
  - id: gpu0
    vendor: nvidia   # nvidia | amd | intel
    backends: [cuda]  # any of: cuda, rocm, vulkan, sycl — must match keys in manifest.yaml backends
  # - id: gpu1
  #   vendor: intel
  #   backends: [vulkan]

paths:
  models_dir: /srv/models/gguf
  state_dir: /var/lib/llm-server-cockpit
  prefix_root: /opt/llm-server-cockpit/builds

retain_builds: 3

hf:
  token_env: HF_TOKEN   # name of the env var holding your HF token — never the token itself
