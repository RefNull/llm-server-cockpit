# Template host profile. This file IS tracked by git — it must never contain real
# machine-specific facts. Copy it to hosts/<your-hostname>.yaml (gitignored by default,
# see .gitignore) and fill in your own values there.

hostname: example-host

network:
  vpn:
    # NIC name, not an IP or hostname — e.g. tailscale0 for Tailscale, wg0 for WireGuard.
    # The gateway binds to whatever address this interface has at the time, resolved fresh
    # on every apply (`ip a` on the host will show you the interface name to use here).
    interface: "TODO"
  wol:
    interface: "TODO"    # NIC that receives the magic packet, e.g. enp5s0
    mac: "00:00:00:00:00:00"
  gateway:
    port: 8090
    health_check_timeout: 120

gpus:
  - id: gpu0
    vendor: nvidia   # nvidia | amd | intel
    backends: [cuda]  # any of: cuda, rocm, vulkan, sycl — must match keys in manifest.yaml backends
  # - id: gpu1
  #   vendor: intel
  #   backends: [vulkan]

paths:
  models_dir: /srv/models/gguf
  state_dir: /var/lib/llm-server-cockpit
  prefix_root: /opt/llm-server-cockpit/builds

retain_builds: 3

hf:
  token_env: HF_TOKEN   # name of the env var holding your HF token — never the token itself

# Both sections below are optional — omit either entirely to keep the defaults
# (restart_policy: on-failure, restart_sec: 5, scheduled restart/update-check off).
service:
  restart_policy: on-failure   # on-failure | always | no
  restart_sec: 5
  scheduled_restart:
    enabled: false
    on_calendar: daily         # systemd OnCalendar= syntax, e.g. "daily", "*-*-* 04:00:00"

update_check:
  enabled: false                # periodic check only — never bumps a pin or rebuilds anything
  on_calendar: daily
